{{define "edit"}}<form id="contact-{{.ID}}" hx-put="{{.ShowURL}}" hx-swap="outerHTML">
<label>Name <input name="name" value="{{.Name}}"></label>{{with index .Problems "name"}} <span class="problem">{{.}}</span>{{end}}
<label>Email <input name="email" value="{{.Email}}"></label>{{with index .Problems "email"}} <span class="problem">{{.}}</span>{{end}}
<button type="submit">Save</button> <button type="button" hx-get="{{.ShowURL}}" hx-target="closest form" hx-swap="outerHTML">Cancel</button>
</form>{{end}}
