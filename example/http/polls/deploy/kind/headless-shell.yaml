apiVersion: apps/v1
kind: Deployment
metadata:
  name: headless-shell
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: headless-shell
  template:
    metadata:
      labels:
        app: headless-shell
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: headless-shell
          image: docker.io/chromedp/headless-shell:160.0.8157.0@sha256:1459842ec97ea88a20645fffae40769c0c8dc70f51cf43e7df812fbaef9909cc
          args:
            - --disable-dev-shm-usage
            - --user-data-dir=/tmp/profile
            - --ignore-certificate-errors-spki-list=$(CA_SPKI)
          env:
            - name: HOME
              value: /tmp
            - name: CA_SPKI
              valueFrom:
                configMapKeyRef:
                  name: headless-shell
                  key: ca-spki
          ports:
            - name: devtools
              containerPort: 9222
          readinessProbe:
            httpGet:
              path: /json/version
              port: devtools
            periodSeconds: 2
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
