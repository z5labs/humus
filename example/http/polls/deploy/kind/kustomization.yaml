apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: polls
resources:
  - namespace.yaml
  - ../base
  - postgres.yaml
  - headless-shell.yaml
  - otel-collector.yaml
  - loki.yaml
  - tempo.yaml
  - mimir.yaml
  - grafana.yaml
configMapGenerator:
  - name: polls
    behavior: merge
    literals:
      - FAULT_TRUST_CA_FILE=/etc/polls/fault-ca/ca.crt
  - name: postgres-config
    files:
      - postgres/pg_hba.conf
  - name: otel-collector-config
    files:
      - otel-collector/config.yaml
  - name: loki-config
    files:
      - loki/config.yaml
  - name: tempo-config
    files:
      - tempo/config.yaml
  - name: mimir-config
    files:
      - mimir/config.yaml
  - name: grafana-datasources
    files:
      - grafana/datasources.yaml
  - name: grafana-alerting
    files:
      - ../alerts.yaml
  - name: grafana-dashboard-providers
    files:
      - grafana/dashboards.yaml
  - name: grafana-dashboards
    files:
      - ../dashboard.json
patches:
  - target:
      kind: Deployment
      name: polls
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: polls
      spec:
        template:
          spec:
            containers:
              - name: polls
                imagePullPolicy: Never
                volumeMounts:
                  - name: fault-ca
                    mountPath: /etc/polls/fault-ca
                    readOnly: true
            volumes:
              - name: fault-ca
                secret:
                  secretName: polls-fault-ca
                  defaultMode: 0440
                  items:
                    - key: ca.crt
                      path: ca.crt
