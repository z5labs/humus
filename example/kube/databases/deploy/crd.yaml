apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: databases.postgres.example.com
spec:
  group: postgres.example.com
  names:
    kind: Database
    listKind: DatabaseList
    plural: databases
    singular: database
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              deletionPolicy:
                default: Retain
                description: 'What deleting the Database does: Retain keeps the database
                  and its role, and Delete drops both.'
                enum:
                - Retain
                - Delete
                type: string
              name:
                description: The name of the database in the server, and of the role
                  that owns it.
                pattern: ^[a-z_][a-z0-9_]{0,62}$
                type: string
                x-kubernetes-validations:
                - message: name is immutable
                  rule: self == oldSelf
            required:
            - name
            type: object
          status:
            properties:
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      format: int64
                      type: integer
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - type
                  - status
                  - lastTransitionTime
                  - reason
                  - message
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              secretName:
                description: The Secret holding the database's credentials.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
status:
  acceptedNames:
    kind: ""
    plural: ""
  conditions: null
  storedVersions: null
