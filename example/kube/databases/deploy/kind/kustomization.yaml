apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: databases
resources:
  - ../crd.yaml
  - ../namespace.yaml
  - ../serviceaccount.yaml
  - ../clusterrole.yaml
  - ../clusterrolebinding.yaml
  - ../role.yaml
  - ../rolebinding.yaml
  - ../deployment.yaml
  - ../poddisruptionbudget.yaml
  - postgres.yaml
  - otel-collector.yaml
  - loki.yaml
  - tempo.yaml
  - mimir.yaml
  - grafana.yaml
configMapGenerator:
  - name: databases
    envs:
      - ../databases.env
    literals:
      - FAULT_TRUSTED_NAMESPACE_PREFIX=databases-cases-
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
  - name: otel-collector-config
    files:
      - otel-collector/config.yaml
  - name: loki-config
    files:
      - loki/config.yaml
  - name: tempo-config
    files:
      - tempo/config.yaml
  - name: mimir-config
    files:
      - mimir/config.yaml
  - name: grafana-datasources
    files:
      - grafana/datasources.yaml
  - name: grafana-alerting
    files:
      - ../alerts.yaml
  - name: grafana-dashboard-providers
    files:
      - grafana/dashboards.yaml
  - name: grafana-dashboards
    files:
      - ../dashboard.json
patches:
  - target:
      kind: Deployment
      name: databases
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: databases
      spec:
        template:
          spec:
            containers:
              - name: databases
                imagePullPolicy: Never
