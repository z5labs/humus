apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: databases-controller
  namespace: databases
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [databases-controller]
    verbs: [get, update]
