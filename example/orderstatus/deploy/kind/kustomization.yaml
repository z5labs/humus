apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: orderstatus
resources:
  - namespace.yaml
  - ../base
  - kafka.yaml
  - topics.yaml
  - postgres.yaml
  - otel-collector.yaml
  - loki.yaml
  - tempo.yaml
  - mimir.yaml
  - grafana.yaml
configMapGenerator:
  - name: orderstatus
    behavior: merge
    literals:
      - RETRY_MIN_DELAY=100ms
      - RETRY_MAX_DELAY=400ms
      - FAULT_TRUSTED_TOPICS=orders.events,orders.retry
  - name: kafka-admin
    files:
      - kafka/admin.properties
      - kafka/topics.sh
  - name: postgres-config
    files:
      - postgres/pg_hba.conf
  - name: postgres-schema
    files:
      - ../../store/schema.sql
  - name: otel-collector-config
    files:
      - otel-collector/config.yaml
  - name: loki-config
    files:
      - loki/config.yaml
  - name: tempo-config
    files:
      - tempo/config.yaml
  - name: mimir-config
    files:
      - mimir/config.yaml
  - name: grafana-datasources
    files:
      - grafana/datasources.yaml
  - name: grafana-alerting
    files:
      - ../alerts.yaml
  - name: grafana-dashboard-providers
    files:
      - grafana/dashboards.yaml
  - name: grafana-dashboards
    files:
      - ../dashboard.json
patches:
  - target:
      kind: Deployment
      name: orderstatus
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: orderstatus
      spec:
        template:
          spec:
            containers:
              - name: orderstatus
                imagePullPolicy: Never
