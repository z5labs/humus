extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  kafkametrics:
    brokers: [kafka:9093]
    tls:
      ca_file: /etc/otel-collector-kafka/ca.crt
      cert_file: /etc/otel-collector-kafka/tls.crt
      key_file: /etc/otel-collector-kafka/tls.key
    scrapers: [consumers]
    group_match: ^orderstatus$
    topic_match: ^orders\.(events|retry)$
    collection_interval: 10s
  k8s_cluster:
    auth_type: serviceAccount
    collection_interval: 10s

processors:
  k8s_attributes:
    auth_type: serviceAccount
    pod_association:
      - sources:
          - from: connection
    extract:
      metadata:
        - k8s.namespace.name
        - k8s.pod.name
        - k8s.deployment.name
        - k8s.node.name
  batch: {}

exporters:
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlp_http/mimir:
    endpoint: http://mimir:9009/otlp

service:
  extensions: [health_check]
  telemetry:
    metrics:
      level: none
  pipelines:
    logs:
      receivers: [otlp]
      processors: [k8s_attributes, batch]
      exporters: [otlp_http/loki]
    traces:
      receivers: [otlp]
      processors: [k8s_attributes, batch]
      exporters: [otlp_grpc/tempo]
    metrics:
      receivers: [otlp]
      processors: [k8s_attributes, batch]
      exporters: [otlp_http/mimir]
    metrics/cluster:
      receivers: [kafkametrics, k8s_cluster]
      processors: [batch]
      exporters: [otlp_http/mimir]
