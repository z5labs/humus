apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderstatus
  labels:
    app.kubernetes.io/name: orderstatus
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: orderstatus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orderstatus
    spec:
      serviceAccountName: orderstatus
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orderstatus
          image: orderstatus
          envFrom:
            - configMapRef:
                name: orderstatus
          ports:
            - name: probes
              containerPort: 8443
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: probes
              scheme: HTTPS
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: probes
              scheme: HTTPS
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: kafka
              mountPath: /etc/orderstatus/kafka
              readOnly: true
            - name: postgres
              mountPath: /etc/orderstatus/postgres
              readOnly: true
            - name: probes
              mountPath: /etc/orderstatus/probes
              readOnly: true
      volumes:
        - name: kafka
          secret:
            secretName: orderstatus-kafka
            defaultMode: 0440
            items:
              - key: ca.crt
                path: ca.crt
              - key: tls.pem
                path: tls.pem
        - name: postgres
          secret:
            secretName: orderstatus-postgres
            defaultMode: 0440
            items:
              - key: password
                path: password
              - key: ca.crt
                path: ca.crt
        - name: probes
          secret:
            secretName: orderstatus-probes
            defaultMode: 0440
            items:
              - key: tls.pem
                path: tls.pem
