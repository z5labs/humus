multitenancy_enabled: false
server:
  http_listen_port: 9009
  log_level: warn
common:
  storage:
    backend: filesystem
blocks_storage:
  filesystem:
    dir: /data/blocks
  bucket_store:
    sync_dir: /data/tsdb-sync
  tsdb:
    dir: /data/tsdb
compactor:
  data_dir: /data/compactor
  sharding_ring:
    kvstore:
      store: memberlist
distributor:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist
ingester:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist
    replication_factor: 1
ruler_storage:
  filesystem:
    dir: /data/rules
store_gateway:
  sharding_ring:
    replication_factor: 1
limits:
  otel_promote_scope_metadata: true
  promote_otel_resource_attributes: k8s.namespace.name,k8s.node.name,k8s.deployment.name,k8s.replicaset.name,k8s.statefulset.name,k8s.daemonset.name,k8s.job.name,k8s.cronjob.name,k8s.hpa.name,k8s.resourcequota.name,k8s.replicationcontroller.name,k8s.pod.name,k8s.container.name
usage_stats:
  enabled: false
