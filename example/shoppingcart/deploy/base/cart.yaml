apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  labels:
    app.kubernetes.io/name: cart
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cart
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cart
    spec:
      serviceAccountName: cart
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: shoppingcart
          command: ["/migrate"]
          env:
            - name: MIGRATIONS
              value: carts
            - name: APP_ROLE
              value: cart
            - name: DATABASE_URL_FILE
              value: /etc/cart/database-owner/url
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: database-owner
              mountPath: /etc/cart/database-owner
              readOnly: true
            - name: ca
              mountPath: /etc/cart/ca
              readOnly: true
      containers:
        - name: cart
          image: shoppingcart
          command: ["/cart"]
          envFrom:
            - configMapRef:
                name: cart
          ports:
            - name: https
              containerPort: 8443
          startupProbe:
            httpGet:
              path: /health/liveness
              port: https
              scheme: HTTPS
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: https
              scheme: HTTPS
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: https
              scheme: HTTPS
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tls
              mountPath: /etc/cart/tls
              readOnly: true
            - name: catalog-client
              mountPath: /etc/cart/catalog-client
              readOnly: true
            - name: database
              mountPath: /etc/cart/database
              readOnly: true
            - name: ca
              mountPath: /etc/cart/ca
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: cart-tls
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        - name: catalog-client
          secret:
            secretName: cart-catalog-client
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        - name: database
          secret:
            secretName: cart-database
            defaultMode: 0440
            items:
              - key: url
                path: url
        - name: database-owner
          secret:
            secretName: cart-database-owner
            defaultMode: 0440
            items:
              - key: url
                path: url
        - name: ca
          secret:
            secretName: cart-ca
            defaultMode: 0440
            items:
              - key: ca.crt
                path: ca.crt
