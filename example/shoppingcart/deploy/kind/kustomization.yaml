apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shoppingcart
resources:
  - ../base
  - postgres.yaml
  - wiremock.yaml
  - otel-collector.yaml
  - loki.yaml
  - tempo.yaml
  - mimir.yaml
  - grafana.yaml
configMapGenerator:
  - name: cart
    behavior: merge
    literals:
      - JWKS_URL=https://wiremock/.well-known/jwks.json
      - FAULT_TRUST_SCOPE=faults:rehearse
  - name: catalog
    behavior: merge
    literals:
      - JWKS_URL=https://wiremock/.well-known/jwks.json
  - name: postgres-config
    files:
      - postgres/pg_hba.conf
  - name: wiremock-mappings
    files:
      - wiremock/jwks.json
  - name: otel-collector-config
    files:
      - otel-collector/config.yaml
  - name: loki-config
    files:
      - loki/config.yaml
  - name: tempo-config
    files:
      - tempo/config.yaml
  - name: mimir-config
    files:
      - mimir/config.yaml
  - name: grafana-datasources
    files:
      - grafana/datasources.yaml
patches:
  - target:
      kind: Deployment
      name: cart
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: cart
      spec:
        template:
          spec:
            initContainers:
              - name: migrate
                imagePullPolicy: Never
            containers:
              - name: cart
                imagePullPolicy: Never
  - target:
      kind: Deployment
      name: catalog
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: catalog
      spec:
        template:
          spec:
            initContainers:
              - name: migrate
                imagePullPolicy: Never
            containers:
              - name: catalog
                imagePullPolicy: Never
