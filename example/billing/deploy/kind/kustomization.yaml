apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: billing
resources:
  - ../namespace.yaml
  - ../serviceaccount.yaml
  - ../cronjob.yaml
  - postgres.yaml
  - wiremock.yaml
  - otel-collector.yaml
  - loki.yaml
  - tempo.yaml
  - mimir.yaml
  - grafana.yaml
configMapGenerator:
  - name: postgres-schema
    files:
      - ../../postgres/schema.sql
  - name: wiremock-mappings
    files:
      - wiremock/charged.json
      - wiremock/declined.json
      - wiremock/unauthorized.json
  - name: otel-collector-config
    files:
      - otel-collector/config.yaml
  - name: loki-config
    files:
      - loki/config.yaml
  - name: tempo-config
    files:
      - tempo/config.yaml
  - name: mimir-config
    files:
      - mimir/config.yaml
  - name: grafana-datasources
    files:
      - grafana/datasources.yaml
patches:
  - target:
      kind: CronJob
      name: billing
    patch: |-
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: billing
      spec:
        suspend: true
        jobTemplate:
          spec:
            template:
              spec:
                containers:
                  - name: billing
                    imagePullPolicy: Never
                    env:
                      - name: PAYMENTS_URL
                        value: https://wiremock
