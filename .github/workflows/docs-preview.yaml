name: Docs PR Preview

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed
    paths:
      - docs/**
      - .github/workflows/docs-preview.yaml

concurrency: preview-${{ github.ref }}

jobs:
  preview:
    runs-on: ubuntu-latest
    # Only run on PRs from the same repo (not forks)
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
    env:
      HUGO_VERSION: 0.152.2
      BASE_URL: https://z5labs.github.io/humus/pr-preview/pr-${{ github.event.pull_request.number }}/
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Hugo CLI
        if: github.event.action != 'closed'
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Install Dart Sass
        if: github.event.action != 'closed'
        run: sudo snap install dart-sass

      - name: Install docsy prerequisites
        if: github.event.action != 'closed'
        working-directory: ./docs
        run: npm install -D postcss postcss-cli autoprefixer

      - name: Build with Hugo
        if: github.event.action != 'closed'
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: America/Los_Angeles
        working-directory: ./docs
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "$BASE_URL"

      - name: Check llms.txt and the Markdown copies
        if: github.event.action != 'closed'
        working-directory: ./docs/public
        run: |
          test -s llms.txt
          links=$(grep -o '^- \[[^]]*\]([^)]*)' llms.txt | sed 's/.*](\(.*\))$/\1/')
          test -n "$links"
          for link in $links; do
            file=${link#"$BASE_URL"}
            if [ "$file" = "$link" ] || [ ! -s "$file" ]; then
              echo "::error::llms.txt links to $link, which is not a Markdown copy on this site"
              exit 1
            fi
          done
          for file in $(find . -name index.html.md | sed 's|^\./||'); do
            if ! printf '%s\n' $links | grep -qxF "$BASE_URL$file"; then
              echo "::error::llms.txt does not list $file"
              exit 1
            fi
          done

      - name: Deploy PR Preview
        uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1
        with:
          source-dir: ./docs/public
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
