  # The databases walkthrough's tests behind the testcontainers build tag run
  # against k3s and PostgreSQL in containers. The ruleset doesn't require this
  # job, and Build doesn't wait on it; Vet the testcontainers tests vets them.
  databases-testcontainers:
    name: Databases walkthrough (testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
          with:
            go-version: '1.27.3'
            cache: false

        - id: go-cache
          uses: ./.github/actions/restore-go-cache
          with:
            name: databases-testcontainers

        - name: Test
          run: go -C example/databases test -count=1 -race -tags testcontainers ./...

        - if: ${{ !cancelled() && steps.go-cache.outputs.key != '' }}
          uses: ./.github/actions/save-go-cache
          with:
            key: ${{ steps.go-cache.outputs.key }}
            path: ${{ steps.go-cache.outputs.path }}

  # The databases walkthrough's image, built from its Dockerfile with the
  # repository as the context, since its module replaces humus and kube with
  # paths under ../.., and its kustomization, rendered. up.sh then creates a
  # kind cluster, generates PostgreSQL's admin password, Grafana's admin
  # password and the probes' certificate, loads the image and applies the
  # kind overlay, with PostgreSQL beside the controller, the cases' namespace
  # prefix trusted, and the LGTM stack behind an OpenTelemetry Collector, and
  # the controller's Deployment has to become ready. The Database beside
  # up.sh is then checked against the CRD with a server-side dry run. The
  # tests behind the functional tag then run the shared cases against it, the
  # failure injection cases included, through the kind cluster's kubeconfig,
  # and verify against the overlay's PostgreSQL with the admin password up.sh
  # generates, and find a reconcile's trace, the controller's records, its
  # humus.kube.controller.* instruments and the containers' restarts in the
  # LGTM stack. They also show that Grafana loaded the alert rules and the
  # dashboard, that Mimir holds every series the rules read, and that each
  # rule evaluates without error. The ruleset doesn't require this job, and
  # Build doesn't wait on it; Vet the functional tests vets them.
  databases-kind:
    name: Databases walkthrough (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: read
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
          with:
            go-version: '1.27.3'
            cache: false

        - id: go-cache
          uses: ./.github/actions/restore-go-cache
          with:
            name: databases-kind

        - name: Build the image
          run: docker build --file example/databases/Dockerfile --tag databases .

        - name: Render the kustomization
          run: kubectl kustomize example/databases/deploy

        - name: Bring the databases controller up on kind
          run: example/databases/deploy/kind/up.sh

        - name: Wait for the databases controller's Deployment
          run: kubectl --namespace databases rollout status deployment/databases --timeout 5m

        - name: Check the Database beside up.sh against the CRD
          run: kubectl apply --dry-run=server --namespace default --filename example/databases/deploy/kind/database.yaml

        - name: Run the shared cases against kind
          run: go -C example/databases test -count=1 -race -tags functional ./functional/

        - name: Show the databases namespace
          if: ${{ failure() }}
          run: |
            kubectl --namespace databases get all
            kubectl --namespace databases describe pods
            kubectl --namespace databases logs deployment/postgres --tail 200 || true
            kubectl --namespace databases logs deployment/databases --all-containers --tail 200 || true
            kubectl --namespace databases logs deployment/otel-collector --tail 200 || true

        - if: ${{ !cancelled() && steps.go-cache.outputs.key != '' }}
          uses: ./.github/actions/save-go-cache
          with:
            key: ${{ steps.go-cache.outputs.key }}
            path: ${{ steps.go-cache.outputs.path }}

  # The wallet walkthrough's tests behind the testcontainers build tag, which
  # run against PostgreSQL in a container, and its contract, checked with a
  # pinned buf: buf lint, buf breaking against main's contract, and buf
  # generate, which has to leave walletpb and ledgerpb as they are checked
  # in. buf generate runs protoc-gen-go and protoc-gen-go-grpc as go tools,
  # so the module's go.mod pins them. A main with no contract yet has nothing
  # to break, so the breaking check says so and passes. The ruleset doesn't
  # require this job, and Build doesn't wait on it; Vet the testcontainers
  # tests vets them.
  wallet-testcontainers:
    name: Wallet walkthrough (testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        - name: Checkout main
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
          with:
            ref: main
            path: main
            persist-credentials: false

        - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
          with:
            go-version: '1.27.3'
            cache: false

        - id: go-cache
          uses: ./.github/actions/restore-go-cache
          with:
            name: wallet-testcontainers

        - name: Test
          run: go -C example/wallet test -count=1 -race -tags testcontainers ./...

        - name: Install buf
          uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
          with:
            version: 1.74.0
            setup_only: true

        - name: Lint the contract
          working-directory: example/wallet/proto
          run: buf lint

        - name: Check the contract for breaking changes against main
          working-directory: example/wallet/proto
          run: |
            against="$GITHUB_WORKSPACE/main/example/wallet/proto"
            if [[ ! -f $against/buf.yaml ]]; then
              echo "::notice::main has no wallet contract yet, so nothing in it can break"
              exit 0
            fi
            buf breaking --against "$against"

        - name: Generate the contract
          working-directory: example/wallet/proto
          run: |
            buf generate
            git add --intent-to-add -- ..
            if ! git diff --exit-code -- ..; then
              echo "::error::buf generate changed the checked-in code; run it in example/wallet/proto and commit the result"
              exit 1
            fi

        - if: ${{ !cancelled() && steps.go-cache.outputs.key != '' }}
          uses: ./.github/actions/save-go-cache
          with:
            key: ${{ steps.go-cache.outputs.key }}
            path: ${{ steps.go-cache.outputs.path }}

  # The wallet walkthrough's image, built from its Dockerfile with the
  # repository as the context, since its module replaces humus with ../..,
  # and its base kustomization, rendered. up.sh then creates a kind cluster,
  # issues every certificate from a CA it generates, makes PostgreSQL's
  # passwords, Grafana's admin password and the signing key, whose key set
  # walletctl jwks makes, and applies the kind overlay, with PostgreSQL over
  # TLS, the ledger's schema applied by its owner, WireMock serving the key
  # set, and the LGTM stack behind an OpenTelemetry Collector, and both
  # services' Deployments have to become ready. The tests behind the
  # functional tag then run the shared cases against it through kubectl
  # port-forward, with the cases' certificate and the signing key from the
  # Secrets up.sh made, rolling each Deployment out and forwarding its port
  # again, and find a send's trace across both services, both services'
  # records of it, both services' metrics by pod, and the Deployments'
  # replicas and restarts in the LGTM stack, then check that Grafana loaded
  # every alert rule and the dashboard, and that after the ledger's breaker
  # opens Mimir holds every series the rules read and each rule evaluates
  # without error. The ruleset doesn't require this job, and Build doesn't
  # wait on it; Vet the functional tests vets them.
  wallet-kind:
    name: Wallet walkthrough (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: read
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
          with:
            go-version: '1.27.3'
            cache: false

        - id: go-cache
          uses: ./.github/actions/restore-go-cache
          with:
            name: wallet-kind

        - name: Build the image
          run: docker build --file example/wallet/Dockerfile --tag wallet .

        - name: Render the kustomization
          run: kubectl kustomize example/wallet/deploy/base

        - name: Bring the wallet and the ledger up on kind
          run: example/wallet/deploy/kind/up.sh

        - name: Run the functional tests against kind
          run: go -C example/wallet test -count=1 -race -tags functional ./functional/

        - name: Show the wallet namespace
          if: ${{ failure() }}
          run: |
            kubectl --namespace wallet get all
            kubectl --namespace wallet describe pods
            kubectl --namespace wallet logs deployment/postgres --tail 200 || true
            kubectl --namespace wallet logs deployment/wiremock --tail 200 || true
            kubectl --namespace wallet logs deployment/ledger --all-containers --tail 200 || true
            kubectl --namespace wallet logs deployment/wallet --all-containers --tail 200 || true
            kubectl --namespace wallet logs deployment/otel-collector --tail 200 || true

        - if: ${{ !cancelled() && steps.go-cache.outputs.key != '' }}
          uses: ./.github/actions/save-go-cache
          with:
            key: ${{ steps.go-cache.outputs.key }}
            path: ${{ steps.go-cache.outputs.path }}
