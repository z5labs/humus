            path: ${{ steps.go-cache.outputs.path }}

  # The order status walkthrough's image, built from its Dockerfile with the
  # repository as the context, since its module replaces humus and
  # queue/kafka with paths under ../.., and its base kustomization, rendered.
  # up.sh then creates a kind cluster, loads the image and applies the kind
  # overlay, with Kafka over mTLS with ACLs, its topics, and PostgreSQL over
  # TLS, and the LGTM stack behind an OpenTelemetry Collector, and the
  # processor's Deployment has to become ready. The tests behind the
  # functional tag then run the shared cases against it, the failure
  # injection cases included, as a client whose certificate up.sh issues, and
  # find an order's trace, the processor's logs and metrics, the group's lag
  # and the containers' restarts in the LGTM stack. They also show that
  # Grafana loaded the alert rules and the dashboard, and that each rule
  # evaluates without error. The ruleset doesn't require this job, and Build
  # doesn't wait on it; Vet the functional tests vets them.
  orderstatus-kind:
    name: Order status walkthrough (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: read
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
          with:
            go-version: '1.27.3'
            cache: false

        - id: go-cache
          uses: ./.github/actions/restore-go-cache
          with:
            name: orderstatus-kind

        - name: Build the image
          run: docker build --file example/orderstatus/Dockerfile --tag orderstatus .

        - name: Render the kustomization
          run: kubectl kustomize example/orderstatus/deploy/base

        - name: Bring the order status processor up on kind
          run: example/orderstatus/deploy/kind/up.sh

        - name: Wait for the order status processor's Deployment
          run: kubectl --namespace orderstatus rollout status deployment/orderstatus --timeout 5m

        - name: Run the shared cases against kind
          run: go -C example/orderstatus test -count=1 -race -tags functional ./functional/

        - name: Show the orderstatus namespace
          if: ${{ failure() }}
          run: |
            kubectl --namespace orderstatus get all
            kubectl --namespace orderstatus describe pods
            kubectl --namespace orderstatus logs deployment/kafka --tail 200 || true
            kubectl --namespace orderstatus logs job/kafka-topics --tail 200 || true
            kubectl --namespace orderstatus logs deployment/postgres --tail 200 || true
            kubectl --namespace orderstatus logs deployment/orderstatus --all-containers --tail 200 || true
            kubectl --namespace orderstatus logs deployment/otel-collector --tail 200 || true

        - if: ${{ !cancelled() && steps.go-cache.outputs.key != '' }}
          uses: ./.github/actions/save-go-cache
          with:
            key: ${{ steps.go-cache.outputs.key }}
            path: ${{ steps.go-cache.outputs.path }}

