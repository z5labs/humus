name: CI

on:
  push:
    branches:
      - "main"
    paths:
      - '**.go'
      - '**/go.mod'
      - '**/go.sum'
      - '.golangci.yaml'
      - 'example/*/*/Dockerfile*'
      - 'example/*/*/deploy/**'
      - 'example/*/*/proto/**'
      - '.claude/hooks/**'
      - '.github/workflows/build.yaml'
      - '.github/actions/**'
  pull_request:
    branches:
      - "main"
  merge_group:

# A push to main runs no tests. The ruleset requires the merge queue, and the
# queue merges an entry by moving main to the commit the entry's run tested,
# so a push run's tests would only test that same commit again. The push run
# is still the only run that saves the Go caches, through save-go-cache: a
# cache a merge queue run saved would belong to its gh-readonly-queue/main/...
# branch, which no other run can restore. So on a push GO_EXEC is true, and
# every go test and go run in a job that saves a cache takes -exec="$GO_EXEC":
# it builds and vets everything it would, then runs true in place of each
# binary, so no test runs, no coverage is gated and no container starts, and
# the job still saves what its pull request and merge queue runs restore. On
# any other event GO_EXEC is empty, and an empty -exec runs each binary as
# usual. A step that fills no cache, such as one building an image or
# bringing a kind cluster up, doesn't run on a push. Lint and vet do, to fill
# golangci-lint's cache and Go's. An admin can bypass the ruleset and push to
# main directly, and such a push goes untested.
#
# Every go command compiles without DWARF, through GOFLAGS, to keep the Go
# caches inside GitHub's cache limit; see save-go-cache. Nothing in CI reads
# DWARF: a failed test, a panic and a race report print their files and
# lines from the binary's own line table.
env:
  GO_EXEC: ${{ github.event_name == 'push' && 'true' || '' }}
  GOFLAGS: -gcflags=all=-dwarf=false

jobs:
  # The default branch's ruleset requires four checks: Build, Kafka
  # (testcontainers), RabbitMQ (testcontainers) and Kubernetes
  # (testcontainers). Build is the job after Scripts, which passes only when
  # every job it waits on that ran passed, so the jobs it waits on can be
  # added, split or renamed without changing the ruleset.
  #
  # `./...` does not descend into a nested module, so each module that
  # ci modules lists is linted and unit tested on its own, in a job of its
  # own in the Lint and test matrix, and every module's job runs at the same
  # time. On a pull request or a merge queue entry the matrix holds only the
  # modules the change affects, as Affected modules decides, and on a push to
  # main every module. A module added to the repository is in the list, and
  # so in the matrix, with no change here. No matrix fails fast, so one run
  # reports every failure. ci is the repository's CI tooling, a Go program in
  # the module under tools/ci that CI runs with go -C tools/ci run .; that
  # module is in the list too, so its job lints it, tests it and gates its
  # coverage like any other's.
  #
  # No job builds every module: go test and golangci-lint both fail on a type
  # error, in a package without tests too, and every main package without
  # tests is linked by the docker build in its walkthrough's kind job.
  #
  # Every job but Scripts, which compiles nothing, restores a Go cache of its
  # own, named in its restore-go-cache step, rather than setup-go's cache,
  # whose one key every job shares. Only a push to main saves one, through
  # save-go-cache, so a pull request or the merge queue compiles from what
  # the same job last compiled on main. Go test results are not reused from
  # those caches, so every go test runs with -count=1. save-go-cache deletes
  # a job's older caches, which is what each of those jobs needs actions:
  # write for.
  modules:
    name: Modules
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    outputs:
      modules: ${{ steps.list.outputs.modules }}
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
          with:
            go-version: '1.27.4'
            cache: false

        - id: go-cache
          uses: ./.github/actions/restore-go-cache
          with:
            name: modules

        - name: List modules
          id: list
          run: |
            modules=$(go -C tools/ci run . modules)
            test -n "$modules"
            echo "$modules"
            echo "modules=$(jq -cnR '[inputs]' <<<"$modules")" >> "$GITHUB_OUTPUT"

        - if: ${{ !cancelled() && steps.go-cache.outputs.key != '' }}
          uses: ./.github/actions/save-go-cache
          with:
            key: ${{ steps.go-cache.outputs.key }}
            path: ${{ steps.go-cache.outputs.path }}

  # On a pull request or a merge queue entry, every job but Modules, Affected
  # modules, Scripts and Build runs only for the modules the change affects,
  # and a job whose modules it doesn't affect is skipped. ci affected
  # decides, as package affected in tools/ci describes: a change affects a
  # module when it touches a file of the module's own directory, such as its
  # Go files, its Dockerfile, its deploy/ directory or its WireMock mappings;
  # a file a package it builds from in another module of the repository is
  # compiled or embeds from, such as humus's own packages through its
  # replace; or the go.mod or go.sum of a module of the repository in its
  # build list. A change to this file, to .github/actions/ or to tools/ci
  # affects every module. A change to .golangci.yaml runs every module's Lint
  # and test job, and affects no module otherwise. Its --json output says
  # which modules each job runs for: modules, those the change affects, which
  # the jobs that test one module each run for, as their if names; lint,
  # those the Lint and test matrix holds; and vet_testcontainers and
  # vet_functional, those the change affects with tests behind that tag,
  # which Vet the tagged tests vets.
  #
  # The change is the pull request's against its base, or the merge queue
  # entry's against the commit it is queued on, so this job fetches the
  # history, without its files. A push to main has no base, so every module
  # is affected: every module is linted and built, and every job runs and
  # saves its cache. When this job fails, nothing was decided, and every job
  # runs, for every module Modules lists. Each job's if names the modules it
  # tests, so a job added for another module needs an if like theirs and no
  # change to ci.
  #
  # A module the change doesn't affect was linted and tested when the change
  # that last affected it merged, so Build passing means every module the
  # change affects passed. A skipped check counts as passing, so a required
  # check this job skips keeps no pull request out of the merge queue or out
  # of main, and the ruleset needs no change.
  affected:
    name: Affected modules
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    outputs:
      modules: ${{ steps.affected.outputs.modules }}
      lint: ${{ steps.affected.outputs.lint }}
      vet_testcontainers: ${{ steps.affected.outputs.vet_testcontainers }}
      vet_functional: ${{ steps.affected.outputs.vet_functional }}
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
          with:
            fetch-depth: 0
            filter: blob:none

        - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
          with:
            go-version: '1.27.4'
            cache: false

        - id: go-cache
          uses: ./.github/actions/restore-go-cache
          with:
            name: affected

        - name: List the affected modules
          id: affected
          env:
            BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          run: |
            plan=$(go -C tools/ci run . affected --base "$BASE" --json)
            jq . <<<"$plan"
            jq -r 'to_entries[] | "\(.key)=\(.value | tojson)"' <<<"$plan" >> "$GITHUB_OUTPUT"

        - if: ${{ !cancelled() && steps.go-cache.outputs.key != '' }}
          uses: ./.github/actions/save-go-cache
          with:
            key: ${{ steps.go-cache.outputs.key }}
            path: ${{ steps.go-cache.outputs.path }}

  # A module's lint and its unit tests share a job, so they share its setup
  # and its one cache, which holds golangci-lint's cache beside Go's. The
  # tests and the coverage gate, ci coverage-gate, run whether lint passed or
  # not, so one run reports both. A package's coverage comes only from its own module's
  # tests, so each module's job gates its own packages, and between them the
  # gate still covers every package outside example/ whenever a change
  # affects its module. On a push to main the tests and ci are only built,
  # for the cache, and nothing is gated.
  lint-and-test:
    name: Lint and test (${{ matrix.module }})
    # It runs for the modules of Affected modules' lint, or for every module
    # when Affected modules failed, and is skipped when there are none.
    needs:
      - modules
      - affected
    if: ${{ !cancelled() && needs.modules.result == 'success' && (needs.affected.result != 'success' || needs.affected.outputs.lint != '[]') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.affected.result == 'success' && needs.affected.outputs.lint || needs.modules.outputs.modules) }}
    env:
      MODULE: ${{ matrix.module }}
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
          with:
            go-version: '1.27.4'
            cache: false

        - id: go-cache
          uses: ./.github/actions/restore-go-cache
          with:
            name: lint-and-test(${{ matrix.module }})
            path: ~/.cache/golangci-lint

        - name: Install golangci-lint
          uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
          with:
            version: v2.15.0
            install-only: true
            skip-cache: true

        # golangci-lint compiles the packages it loads, and with -race it
        # compiles them as Test does, so the two share every package in the
        # job's cache rather than each compiling a copy of its own. No
        # package in the repository builds differently under the race tag.
        - name: Lint
          working-directory: ${{ matrix.module }}
          env:
            GOFLAGS: ${{ env.GOFLAGS }} -race
          run: golangci-lint run

        # The cache step runs only when checkout and setup-go succeeded, so
        # the steps from here on run once Go is set up, whatever happened to
        # golangci-lint.
        - name: Test
          if: ${{ !cancelled() && steps.go-cache.outcome == 'success' }}
          run: |
            go -C "$MODULE" test -exec="$GO_EXEC" -count=1 -race -cover \
              -coverprofile="$RUNNER_TEMP/coverage.out" ./...

        - name: List the packages the coverage gate covers
          if: ${{ !cancelled() && steps.go-cache.outcome == 'success' && github.event_name != 'push' }}
          run: |
            examples="$(go list -m)/example"
            go -C "$MODULE" list ./... > "$RUNNER_TEMP/module-packages.txt"
            awk -v examples="$examples" '$0 != examples && index($0, examples "/") != 1' \
              "$RUNNER_TEMP/module-packages.txt" > "$RUNNER_TEMP/packages.txt"

        - name: Require 80% statement coverage of every library package
          if: ${{ !cancelled() && steps.go-cache.outcome == 'success' }}
          run: go -C tools/ci run -exec="$GO_EXEC" . coverage-gate 80 "$RUNNER_TEMP/packages.txt" "$RUNNER_TEMP/coverage.out"

        - if: ${{ !cancelled() && steps.go-cache.outputs.key != '' }}
          uses: ./.github/actions/save-go-cache
          with:
            key: ${{ steps.go-cache.outputs.key }}
            path: ${{ steps.go-cache.outputs.path }}

  # The tests behind the testcontainers tag run in the testcontainers jobs
  # below, and those behind the functional tag against a deployment, such as
  # a walkthrough's on kind, so here they are only compiled and vetted,
  # without starting a container. Each tag's tests are vetted in every
  # module the change affects that has a Go file behind the tag, as Affected
  # modules' vet_testcontainers and vet_functional say, so a new module needs
  # no change here. When Affected modules failed, every module Modules lists
  # is vetted with each tag, and when the change affects no module with
  # tagged tests, the job is skipped. Both tags are vetted in one job, so
  # they share one cache: they compile nearly the same packages, and two
  # caches of them would each be as big as this one.
  vet:
    name: Vet the tagged tests
    needs:
      - modules
      - affected
    if: ${{ !cancelled() && needs.modules.result == 'success' && (needs.affected.result != 'success' || needs.affected.outputs.vet_testcontainers != '[]' || needs.affected.outputs.vet_functional != '[]') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
          with:
            go-version: '1.27.4'
            cache: false

        - id: go-cache
          uses: ./.github/actions/restore-go-cache
          with:
            name: vet

        - name: Vet the testcontainers tests
          env:
            MODULES: ${{ needs.affected.result == 'success' && needs.affected.outputs.vet_testcontainers || needs.modules.outputs.modules }}
          run: |
            failed=0
            for module in $(jq -r '.[]' <<<"$MODULES"); do
              echo "::group::go vet -tags testcontainers ($module)"
              go -C "$module" vet -tags testcontainers ./... || failed=1
              echo "::endgroup::"
            done
            exit "$failed"

        # It runs whether the testcontainers tests' vet passed or not, so one
        # run reports both.
        - name: Vet the functional tests
          if: ${{ !cancelled() && steps.go-cache.outcome == 'success' }}
          env:
            MODULES: ${{ needs.affected.result == 'success' && needs.affected.outputs.vet_functional || needs.modules.outputs.modules }}
          run: |
            failed=0
            for module in $(jq -r '.[]' <<<"$MODULES"); do
              echo "::group::go vet -tags functional ($module)"
              go -C "$module" vet -tags functional ./... || failed=1
              echo "::endgroup::"
            done
            exit "$failed"

        - if: ${{ !cancelled() && steps.go-cache.outputs.key != '' }}
          uses: ./.github/actions/save-go-cache
          with:
            key: ${{ steps.go-cache.outputs.key }}
            path: ${{ steps.go-cache.outputs.path }}

  # The loopback half of humustest's conformance test opens real sockets on
  # 127.0.0.1 and 127.0.0.2, and telemetry's sets OTEL_* variables in the
  # real environment, so both are behind the conformance build tag and run
  # here rather than with the unit tests.
  conformance:
    name: Conformance
    # It runs when the change affects the root module, as Affected modules
    # decides.
    needs: affected
    if: ${{ !cancelled() && (needs.affected.result != 'success' || contains(needs.affected.outputs.modules, '"."')) }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
          with:
            go-version: '1.27.4'
            cache: false

        - id: go-cache
          uses: ./.github/actions/restore-go-cache
          with:
            name: conformance

        - name: Conformance
          run: go test -exec="$GO_EXEC" -count=1 -race -tags conformance -run '^TestConformance_' ./humustest/ ./telemetry/

        - if: ${{ !cancelled() && steps.go-cache.outputs.key != '' }}
          uses: ./.github/actions/save-go-cache
          with:
            key: ${{ steps.go-cache.outputs.key }}
            path: ${{ steps.go-cache.outputs.path }}

  # Scripts saves no cache, so a push to main doesn't run it.
  scripts:
    name: Scripts
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        # The hook reads golangci-lint's pin from this file, so a change here
        # that it can no longer read fails this step.
        - name: Test the golangci-lint install hook
          run: .claude/hooks/install-golangci-lint_test.sh

        - name: Test the cloud environment setup script
          if: ${{ !cancelled() }}
          run: .claude/hooks/cloud-setup_test.sh

  # The check the ruleset requires. It runs whatever happened to the jobs it
  # needs, and passes only when every one of them that ran succeeded: a job
  # that failed or was cancelled fails it, and one skipped because the change
  # affects none of its modules, as Affected modules decides, doesn't. Each
  # of those jobs runs unless Modules failed, which fails this job too, or
  # the change doesn't affect its modules; when Affected modules failed, they
  # all run. So when the change affects no module, this job still reports,
  # and passes when Modules and Scripts did. A skipped required check counts
  # as passing, so in a pull request or the merge queue this job never skips
  # itself. Nothing requires it on a push to main, which tests nothing and
  # skips Scripts, so a push skips it.
  build:
    name: Build
    needs:
      - modules
      - lint-and-test
      - vet
      - conformance
      - scripts
    if: ${{ always() && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
        - name: Require every job to have passed
          env:
            NEEDS: ${{ toJSON(needs) }}
          run: |
            jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
            jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS" >/dev/null

  # The container and kind jobs below that the ruleset doesn't require, those
  # of the walkthroughs, flaky and the migration guides, start only once
  # every job Build waits on has finished, so each one needs Affected modules
  # and the same jobs Build needs, and a job added to Build's needs belongs
  # in theirs too. The account runs at most 20 jobs at a time, and the Lint
  # and test jobs start only after Modules and Affected modules, so a job
  # with no needs but Affected modules would take a runner first, and when
  # other runs are using the runners too, Build's Lint and test jobs would
  # queue behind every one of them. Waiting on Build's jobs puts the checks
  # the ruleset requires first, and the results of these jobs come later.
  # Their if checks !cancelled() rather than success(), so they still run
  # when one of Build's jobs failed or was skipped because the change didn't
  # affect its modules, and one run still reports every failure, but not when
  # the run was cancelled. A push to main skips Scripts, and these jobs run
  # all the same, and save their caches.

  # The tests behind the testcontainers build tag run Kafka in a container
  # and open real sockets, so they run here rather than with the unit tests:
  # they don't slow the unit tests, they don't count toward the coverage
  # gate, and this job is a required check of its own.
  kafka-testcontainers:
    name: Kafka (testcontainers)
    # It runs when the change affects queue/kafka, as Affected modules decides.
    needs: affected
    if: ${{ !cancelled() && (needs.affected.result != 'success' || contains(needs.affected.outputs.modules, '"queue/kafka"')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
          with:
            go-version: '1.27.4'
            cache: false

        - id: go-cache
          uses: ./.github/actions/restore-go-cache
          with:
            name: kafka-testcontainers

        - name: Test
          run: go -C queue/kafka test -exec="$GO_EXEC" -count=1 -race -tags testcontainers ./...

        - if: ${{ !cancelled() && steps.go-cache.outputs.key != '' }}
          uses: ./.github/actions/save-go-cache
          with:
            key: ${{ steps.go-cache.outputs.key }}
            path: ${{ steps.go-cache.outputs.path }}

  # The tests behind the testcontainers build tag run RabbitMQ in a container
  # and open real sockets, so they run here rather than with the unit tests:
  # they don't slow the unit tests, they don't count toward the coverage
  # gate, and this job is a required check of its own. humus keeps no fake
  # broker, so these are the only tests of queue/rabbitmq that reach one.
  rabbitmq-testcontainers:
    name: RabbitMQ (testcontainers)
    # It runs when the change affects queue/rabbitmq, as Affected modules decides.
    needs: affected
    if: ${{ !cancelled() && (needs.affected.result != 'success' || contains(needs.affected.outputs.modules, '"queue/rabbitmq"')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
          with:
            go-version: '1.27.4'
            cache: false

        - id: go-cache
          uses: ./.github/actions/restore-go-cache
          with:
            name: rabbitmq-testcontainers

        - name: Test
          run: go -C queue/rabbitmq test -exec="$GO_EXEC" -count=1 -race -tags testcontainers ./...

        - if: ${{ !cancelled() && steps.go-cache.outputs.key != '' }}
          uses: ./.github/actions/save-go-cache
          with:
            key: ${{ steps.go-cache.outputs.key }}
            path: ${{ steps.go-cache.outputs.path }}

  # The tests behind the testcontainers build tag run k3s's Kubernetes API
  # server in a container and open real sockets, so they run here rather than
  # with the unit tests: they don't slow the unit tests, they don't count
  # toward the coverage gate, and this job is a required check of its own.
  # humus keeps no fake API server, so these are the only tests of kube that
  # reach one. They run with -v, so the log shows how long each test took,
  # and how long k3s took to start, pulling its image included.
  kube-testcontainers:
    name: Kubernetes (testcontainers)
    # It runs when the change affects kube, as Affected modules decides.
    needs: affected
    if: ${{ !cancelled() && (needs.affected.result != 'success' || contains(needs.affected.outputs.modules, '"kube"')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
          with:
            go-version: '1.27.4'
            cache: false

        - id: go-cache
          uses: ./.github/actions/restore-go-cache
          with:
            name: kube-testcontainers

        - name: Test
          run: go -C kube test -exec="$GO_EXEC" -count=1 -race -v -tags testcontainers ./...

        - if: ${{ !cancelled() && steps.go-cache.outputs.key != '' }}
          uses: ./.github/actions/save-go-cache
          with:
            key: ${{ steps.go-cache.outputs.key }}
            path: ${{ steps.go-cache.outputs.path }}

  # The shoppingcart walkthrough's tests behind the testcontainers build tag
  # run its Stores and migrate, and the shared cases against both services
  # on humus.OSHost(), against PostgreSQL and WireMock in containers. The
  # ruleset doesn't require this job, and Build doesn't wait on it; Vet the
  # tagged tests vets them.
  shoppingcart-testcontainers:
    name: Shoppingcart walkthrough (testcontainers)
    # It runs when the change affects example/http/shoppingcart, as Affected
    # modules decides.
    needs:
      - affected
      - modules
      - lint-and-test
      - vet
      - conformance
      - scripts
    if: ${{ !cancelled() && (needs.affected.result != 'success' || contains(needs.affected.outputs.modules, '"example/http/shoppingcart"')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
          with:
            go-version: '1.27.4'
            cache: false

        - id: go-cache
          uses: ./.github/actions/restore-go-cache
          with:
            name: shoppingcart-testcontainers

        - name: Test
          run: go -C example/http/shoppingcart test -exec="$GO_EXEC" -count=1 -race -tags testcontainers ./...

        - if: ${{ !cancelled() && steps.go-cache.outputs.key != '' }}
          uses: ./.github/actions/save-go-cache
          with:
