name: CI

on:
  push:
    branches:
      - "main"
    paths:
      - '**.go'
      - '**/go.mod'
      - '**/go.sum'
      - '.golangci.yaml'
      - '.github/scripts/**'
      - '.github/workflows/build.yaml'
  pull_request:
    branches:
      - "main"
  merge_group:

jobs:
  # The default branch requires a status check named exactly Build, so every
  # module is checked by this one job rather than by a matrix, which would
  # rename the check. `./...` does not descend into a nested module, so each
  # step runs once per module that go-modules.sh lists. Each step after the
  # first runs even when an earlier one failed, so one run reports every
  # failure, and the job fails if any step failed.
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
          with:
            go-version: '1.27.2'
            cache-dependency-path: '**/go.sum'

        - name: Install golangci-lint
          uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
          with:
            version: v2.15.0
            install-only: true

        - name: List modules
          run: .github/scripts/go-modules.sh | tee "$RUNNER_TEMP/modules.txt"

        - name: Lint
          if: ${{ !cancelled() }}
          run: |
            failed=0
            for module in $(cat "$RUNNER_TEMP/modules.txt"); do
              echo "::group::golangci-lint ($module)"
              (cd "$module" && golangci-lint run) || failed=1
              echo "::endgroup::"
            done
            exit "$failed"

        - name: Build
          if: ${{ !cancelled() }}
          run: |
            failed=0
            for module in $(cat "$RUNNER_TEMP/modules.txt"); do
              echo "::group::go build ($module)"
              go -C "$module" build ./... || failed=1
              echo "::endgroup::"
            done
            exit "$failed"

        # Every module's profile is merged into one, so that one gate covers
        # them all, and every package outside example/ is listed for the gate.
        - name: Test
          if: ${{ !cancelled() }}
          run: |
            failed=0
            examples="$(go list -m)/example"
            : > "$RUNNER_TEMP/coverage.out"
            : > "$RUNNER_TEMP/packages.txt"
            for module in $(cat "$RUNNER_TEMP/modules.txt"); do
              echo "::group::go test ($module)"
              rm -f "$RUNNER_TEMP/module-coverage.out"
              go -C "$module" test -race -cover \
                -coverprofile="$RUNNER_TEMP/module-coverage.out" ./... || failed=1
              cat "$RUNNER_TEMP/module-coverage.out" >> "$RUNNER_TEMP/coverage.out" || failed=1
              go -C "$module" list ./... > "$RUNNER_TEMP/module-packages.txt" || failed=1
              awk -v examples="$examples" '$0 != examples && index($0, examples "/") != 1' \
                "$RUNNER_TEMP/module-packages.txt" >> "$RUNNER_TEMP/packages.txt" || failed=1
              echo "::endgroup::"
            done
            exit "$failed"

        # The tests behind the testcontainers tag run only in the Kafka
        # (testcontainers), RabbitMQ (testcontainers) and Shoppingcart
        # (testcontainers) jobs, which are not required, so they are compiled
        # and vetted here, without starting a container.
        - name: Vet the testcontainers tests
          if: ${{ !cancelled() }}
          run: |
            failed=0
            go -C queue/kafka vet -tags testcontainers ./... || failed=1
            go -C queue/rabbitmq vet -tags testcontainers ./... || failed=1
            go -C example vet -tags testcontainers ./... || failed=1
            exit "$failed"

        # The loopback half of humustest's conformance test opens real
        # sockets on 127.0.0.1 and 127.0.0.2, and telemetry's sets OTEL_*
        # variables in the real environment, so both are behind the
        # conformance build tag and run here rather than with the unit
        # tests.
        - name: Conformance
          if: ${{ !cancelled() }}
          run: go test -race -tags conformance -run '^TestConformance_' ./humustest/ ./telemetry/

        - name: Require 80% statement coverage of every library package
          if: ${{ !cancelled() }}
          run: .github/scripts/coverage-gate.sh 80 "$RUNNER_TEMP/packages.txt" "$RUNNER_TEMP/coverage.out"

        - name: Test the coverage gate
          if: ${{ !cancelled() }}
          run: .github/scripts/coverage-gate_test.sh

        - name: Test the release script
          if: ${{ !cancelled() }}
          run: .github/scripts/release-modules_test.sh

  # The tests behind the testcontainers build tag run Kafka in a container
  # and open real sockets, so they run here rather than in Build: they don't
  # slow the unit tests, they don't count toward the coverage gate, and this
  # job is not a required check.
  kafka-testcontainers:
    name: Kafka (testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
          with:
            go-version: '1.27.2'
            cache-dependency-path: '**/go.sum'

        - name: Test
          run: go -C queue/kafka test -race -tags testcontainers ./...

  # The tests behind the testcontainers build tag run RabbitMQ in a container
  # and open real sockets, so they run here rather than in Build: they don't
  # slow the unit tests, they don't count toward the coverage gate, and this
  # job is not a required check. humus keeps no fake broker, so these are the
  # only tests of queue/rabbitmq that reach one.
  rabbitmq-testcontainers:
    name: RabbitMQ (testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
          with:
            go-version: '1.27.2'
            cache-dependency-path: '**/go.sum'

        - name: Test
          run: go -C queue/rabbitmq test -race -tags testcontainers ./...

  # The tests behind the testcontainers build tag run the shoppingcart's
  # Store, and the whole service on humus.OSHost(), against Postgres in a
  # container, so they run here rather than in Build: they don't slow the
  # unit tests, example/ is outside the coverage gate anyway, and this job is
  # not a required check.
  shoppingcart-testcontainers:
    name: Shoppingcart (testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
          with:
            go-version: '1.27.2'
            cache-dependency-path: '**/go.sum'

        - name: Test
          run: go -C example test -race -tags testcontainers ./...
