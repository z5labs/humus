            path: ${{ steps.go-cache.outputs.path }}

  # The mailer walkthrough's image, built from its Dockerfile with the
  # repository as the context, since its module replaces humus and
  # queue/rabbitmq with paths under ../.., and its base kustomization,
  # rendered. up.sh then creates a kind cluster, loads the image and applies
  # the kind overlay, and the mailer's Deployment has to become ready. The
  # tests behind the functional tag then run the shared cases against it, and
  # find a request's trace, logs and metrics in the overlay's LGTM stack. The
  # ruleset doesn't require this job, and Build doesn't wait on it; Vet the
  # testcontainers tests vets them.
  mailer-kind:
    name: Mailer walkthrough (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: read
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
          with:
            go-version: '1.27.3'
            cache: false

        - id: go-cache
          uses: ./.github/actions/restore-go-cache
          with:
            name: mailer-kind

        - name: Build the image
          run: docker build --file example/mailer/Dockerfile --tag mailer .

        - name: Render the kustomization
          run: kubectl kustomize example/mailer/deploy/base

        - name: Bring the mailer up on kind
          run: example/mailer/deploy/kind/up.sh

        - name: Wait for the mailer's Deployment
          run: kubectl --namespace mailer rollout status deployment/mailer --timeout 5m

        - name: Run the shared cases against kind
