name: CI

on:
  push:
    branches:
      - "main"
    paths:
      - '**.go'
      - '**/go.mod'
      - '**/go.sum'
      - '.golangci.yaml'
      - 'example/*/Dockerfile*'
      - 'example/*/deploy/**'
      - 'example/*/proto/**'
      - '.github/scripts/**'
      - '.github/workflows/build.yaml'
  pull_request:
    branches:
      - "main"
  merge_group:

jobs:
  # The default branch's ruleset requires four checks: Build, Kafka
  # (testcontainers), RabbitMQ (testcontainers) and Kubernetes
  # (testcontainers). Build is the job at the end of this
  # file, which passes only when every job before it passed, so the jobs it
  # waits on can be added, split or renamed without changing the ruleset.
  #
  # `./...` does not descend into a nested module, so lint, compile and test
  # each run once per module that go-modules.sh lists, in a matrix, and every
  # module's run at the same time. A module added to the repository is in the
  # list, and so in every matrix, with no change here. No matrix fails fast,
  # so one run reports every failure.
  #
  # Every job but Scripts, which compiles nothing, restores a Go cache of its
  # own, named in its restore-go-cache step, rather than setup-go's cache,
  # whose one key every job shares. Only a push to main saves one, through
  # save-go-cache, so a pull request or the merge queue compiles from what
  # the same job last compiled on main. Go test results are not reused from
  # those caches, so every go test runs with -count=1. save-go-cache deletes
  # a job's older caches, which is what each of those jobs needs actions:
  # write for.
  modules:
    name: Modules
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    outputs:
      modules: ${{ steps.list.outputs.modules }}
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
          with:
            go-version: '1.27.3'
            cache: false

        - id: go-cache
          uses: ./.github/actions/restore-go-cache
          with:
            name: modules

        - name: List modules
          id: list
          run: |
            modules=$(.github/scripts/go-modules.sh)
            test -n "$modules"
            echo "$modules"
            echo "modules=$(jq -cnR '[inputs]' <<<"$modules")" >> "$GITHUB_OUTPUT"

        - if: ${{ !cancelled() && steps.go-cache.outputs.key != '' }}
          uses: ./.github/actions/save-go-cache
          with:
            key: ${{ steps.go-cache.outputs.key }}
            path: ${{ steps.go-cache.outputs.path }}

  lint:
    name: Lint (${{ matrix.module }})
    needs: modules
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.modules.outputs.modules) }}
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
          with:
            go-version: '1.27.3'
            cache: false

        - id: go-cache
          uses: ./.github/actions/restore-go-cache
          with:
            name: lint(${{ matrix.module }})
            path: ~/.cache/golangci-lint

        - name: Install golangci-lint
          uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
          with:
            version: v2.15.0
            install-only: true
            skip-cache: true

        - name: Lint
          working-directory: ${{ matrix.module }}
          run: golangci-lint run

        - if: ${{ !cancelled() && steps.go-cache.outputs.key != '' }}
          uses: ./.github/actions/save-go-cache
          with:
            key: ${{ steps.go-cache.outputs.key }}
            path: ${{ steps.go-cache.outputs.path }}

  compile:
    name: Compile (${{ matrix.module }})
    needs: modules
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.modules.outputs.modules) }}
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
          with:
            go-version: '1.27.3'
            cache: false

        - id: go-cache
          uses: ./.github/actions/restore-go-cache
          with:
            name: compile(${{ matrix.module }})

        - name: Build
          run: go -C "$MODULE" build ./...
          env:
            MODULE: ${{ matrix.module }}

        - if: ${{ !cancelled() && steps.go-cache.outputs.key != '' }}
          uses: ./.github/actions/save-go-cache
          with:
            key: ${{ steps.go-cache.outputs.key }}
            path: ${{ steps.go-cache.outputs.path }}

  # A package's coverage comes only from its own module's tests, so each
  # module's job gates its own packages, and between them the gate still
  # covers every package outside example/.
  test:
    name: Test (${{ matrix.module }})
    needs: modules
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.modules.outputs.modules) }}
    env:
      MODULE: ${{ matrix.module }}
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
          with:
            go-version: '1.27.3'
            cache: false

        - id: go-cache
          uses: ./.github/actions/restore-go-cache
          with:
            name: test(${{ matrix.module }})

        - name: Test
          run: |
            go -C "$MODULE" test -count=1 -race -cover \
              -coverprofile="$RUNNER_TEMP/coverage.out" ./...

        - name: List the packages the coverage gate covers
          if: ${{ !cancelled() }}
          run: |
            examples="$(go list -m)/example"
            go -C "$MODULE" list ./... > "$RUNNER_TEMP/module-packages.txt"
            awk -v examples="$examples" '$0 != examples && index($0, examples "/") != 1' \
              "$RUNNER_TEMP/module-packages.txt" > "$RUNNER_TEMP/packages.txt"

        - name: Require 80% statement coverage of every library package
          if: ${{ !cancelled() }}
          run: .github/scripts/coverage-gate.sh 80 "$RUNNER_TEMP/packages.txt" "$RUNNER_TEMP/coverage.out"

        - if: ${{ !cancelled() && steps.go-cache.outputs.key != '' }}
          uses: ./.github/actions/save-go-cache
          with:
            key: ${{ steps.go-cache.outputs.key }}
            path: ${{ steps.go-cache.outputs.path }}

  # The tests behind the testcontainers tag run in the testcontainers
  # jobs below, and the tests behind the functional tag in the kind jobs, so
  # here they are only compiled and vetted, without starting a container,
  # alongside the unit tests. Every module under example/ that go-modules.sh
  # lists is vetted with both tags, so a new example needs no change here.
  vet-testcontainers:
    name: Vet the testcontainers tests
    needs: modules
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
          with:
            go-version: '1.27.3'
            cache: false

        - id: go-cache
          uses: ./.github/actions/restore-go-cache
          with:
            name: vet-testcontainers

        - name: Vet
          env:
            MODULES: ${{ needs.modules.outputs.modules }}
          run: |
            failed=0
            go -C queue/kafka vet -tags testcontainers ./... || failed=1
            go -C queue/rabbitmq vet -tags testcontainers ./... || failed=1
            go -C kube vet -tags testcontainers ./... || failed=1
            go -C tools/flaky vet -tags testcontainers ./... || failed=1
            for module in $(jq -r '.[] | select(startswith("example/"))' <<<"$MODULES"); do
              echo "::group::go vet -tags testcontainers ($module)"
              go -C "$module" vet -tags testcontainers ./... || failed=1
              echo "::endgroup::"
              echo "::group::go vet -tags functional ($module)"
              go -C "$module" vet -tags functional ./... || failed=1
              echo "::endgroup::"
            done
            exit "$failed"

        - if: ${{ !cancelled() && steps.go-cache.outputs.key != '' }}
          uses: ./.github/actions/save-go-cache
          with:
            key: ${{ steps.go-cache.outputs.key }}
            path: ${{ steps.go-cache.outputs.path }}

  # The tests behind the functional tag run against a deployment, such as a
  # walkthrough's on kind, so here they are only compiled and vetted. Every
  # module under example/ that go-modules.sh lists is vetted, so a new
  # example needs no change here.
  vet-functional:
    name: Vet the functional tests
    needs: modules
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
          with:
            go-version: '1.27.3'
            cache: false

        - id: go-cache
          uses: ./.github/actions/restore-go-cache
          with:
            name: vet-functional

        - name: Vet
          env:
            MODULES: ${{ needs.modules.outputs.modules }}
          run: |
            failed=0
            for module in $(jq -r '.[] | select(startswith("example/"))' <<<"$MODULES"); do
              echo "::group::go vet -tags functional ($module)"
              go -C "$module" vet -tags functional ./... || failed=1
              echo "::endgroup::"
            done
            exit "$failed"

        - if: ${{ !cancelled() && steps.go-cache.outputs.key != '' }}
          uses: ./.github/actions/save-go-cache
          with:
            key: ${{ steps.go-cache.outputs.key }}
            path: ${{ steps.go-cache.outputs.path }}

  # The loopback half of humustest's conformance test opens real sockets on
  # 127.0.0.1 and 127.0.0.2, and telemetry's sets OTEL_* variables in the
  # real environment, so both are behind the conformance build tag and run
  # here rather than with the unit tests.
  conformance:
    name: Conformance
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
          with:
            go-version: '1.27.3'
            cache: false

        - id: go-cache
          uses: ./.github/actions/restore-go-cache
          with:
            name: conformance

        - name: Conformance
          run: go test -count=1 -race -tags conformance -run '^TestConformance_' ./humustest/ ./telemetry/

        - if: ${{ !cancelled() && steps.go-cache.outputs.key != '' }}
          uses: ./.github/actions/save-go-cache
          with:
            key: ${{ steps.go-cache.outputs.key }}
            path: ${{ steps.go-cache.outputs.path }}

  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        # The release script runs go mod edit.
        - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
          with:
            go-version: '1.27.3'
            cache: false

        - name: Test the coverage gate
          run: .github/scripts/coverage-gate_test.sh

        - name: Test the release script
          if: ${{ !cancelled() }}
          run: .github/scripts/release-modules_test.sh

  # The check the ruleset requires. It runs whatever happened to the jobs it
  # needs, and passes only when every one of them succeeded: a job that
  # failed, was cancelled or was skipped fails it. A skipped required check
  # counts as passing, so this job never skips itself.
  build:
    name: Build
    needs:
      - modules
      - lint
      - compile
      - test
      - vet-testcontainers
      - vet-functional
      - conformance
      - scripts
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
        - name: Require every job to have passed
          env:
            NEEDS: ${{ toJSON(needs) }}
          run: |
            jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
            jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null

  # The tests behind the testcontainers build tag run Kafka in a container
  # and open real sockets, so they run here rather than in Test: they don't
  # slow the unit tests, they don't count toward the coverage gate, and this
  # job is a required check of its own.
  kafka-testcontainers:
    name: Kafka (testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
          with:
            go-version: '1.27.3'
            cache: false

        - id: go-cache
          uses: ./.github/actions/restore-go-cache
          with:
            name: kafka-testcontainers

        - name: Test
          run: go -C queue/kafka test -count=1 -race -tags testcontainers ./...

        - if: ${{ !cancelled() && steps.go-cache.outputs.key != '' }}
          uses: ./.github/actions/save-go-cache
          with:
            key: ${{ steps.go-cache.outputs.key }}
            path: ${{ steps.go-cache.outputs.path }}

  # The tests behind the testcontainers build tag run RabbitMQ in a container
  # and open real sockets, so they run here rather than in Test: they don't
  # slow the unit tests, they don't count toward the coverage gate, and this
  # job is a required check of its own. humus keeps no fake broker, so these
  # are the only tests of queue/rabbitmq that reach one.
  rabbitmq-testcontainers:
    name: RabbitMQ (testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
          with:
            go-version: '1.27.3'
            cache: false

        - id: go-cache
          uses: ./.github/actions/restore-go-cache
          with:
            name: rabbitmq-testcontainers

        - name: Test
          run: go -C queue/rabbitmq test -count=1 -race -tags testcontainers ./...

        - if: ${{ !cancelled() && steps.go-cache.outputs.key != '' }}
          uses: ./.github/actions/save-go-cache
          with:
            key: ${{ steps.go-cache.outputs.key }}
            path: ${{ steps.go-cache.outputs.path }}

  # The tests behind the testcontainers build tag run k3s's Kubernetes API
  # server in a container and open real sockets, so they run here rather than
  # in Test: they don't slow the unit tests, they don't count toward the
  # coverage gate, and this job is a required check of its own. humus keeps
  # no fake API server, so these are the only tests of kube that reach one.
  # They run with -v, so the log shows how long each test took, and how long
  # k3s took to start, pulling its image included.
  kube-testcontainers:
    name: Kubernetes (testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
          with:
            go-version: '1.27.3'
            cache: false

        - id: go-cache
          uses: ./.github/actions/restore-go-cache
          with:
            name: kube-testcontainers

        - name: Test
          run: go -C kube test -count=1 -race -v -tags testcontainers ./...

        - if: ${{ !cancelled() && steps.go-cache.outputs.key != '' }}
          uses: ./.github/actions/save-go-cache
          with:
            key: ${{ steps.go-cache.outputs.key }}
            path: ${{ steps.go-cache.outputs.path }}

  # The shoppingcart walkthrough's tests behind the testcontainers build tag
  # run its Stores and migrate, and the shared cases against both services
  # on humus.OSHost(), against PostgreSQL and WireMock in containers. The
  # ruleset doesn't require this job, and Build doesn't wait on it; Vet the
  # testcontainers tests vets them.
  shoppingcart-testcontainers:
    name: Shoppingcart walkthrough (testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
          with:
            go-version: '1.27.3'
            cache: false

        - id: go-cache
          uses: ./.github/actions/restore-go-cache
          with:
            name: shoppingcart-testcontainers

        - name: Test
          run: go -C example/shoppingcart test -count=1 -race -tags testcontainers ./...

        - if: ${{ !cancelled() && steps.go-cache.outputs.key != '' }}
          uses: ./.github/actions/save-go-cache
          with:
            key: ${{ steps.go-cache.outputs.key }}
            path: ${{ steps.go-cache.outputs.path }}

  # flaky's tests behind the testcontainers build tag start containers on the
  # runner's Docker, and check that flaky pins each one labelled
  # org.testcontainers to the cores it keeps back from its runs. They also
  # bring a kind cluster up, and check that flaky pins its node container to
  # the cores of its lane. The ruleset doesn't require this job, and Build
  # doesn't wait on it; Vet the testcontainers tests vets them.
  flaky-testcontainers:
    name: flaky (testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
          with:
            go-version: '1.27.3'
            cache: false

        - id: go-cache
          uses: ./.github/actions/restore-go-cache
          with:
            name: flaky-testcontainers

        - name: Test
          run: go -C tools/flaky test -count=1 -race -tags testcontainers ./...

        - if: ${{ !cancelled() && steps.go-cache.outputs.key != '' }}
          uses: ./.github/actions/save-go-cache
          with:
            key: ${{ steps.go-cache.outputs.key }}
            path: ${{ steps.go-cache.outputs.path }}

  # The shoppingcart walkthrough's image, built from its Dockerfile with the
  # repository as the context, since its module replaces humus with ../..,
  # and its base kustomization, rendered. up.sh then creates a kind cluster,
  # issues every certificate from a CA it generates, makes the roles'
  # passwords, Grafana's admin password and the signing key, and applies the
  # kind overlay, with PostgreSQL over TLS, WireMock serving the key set, and
  # the LGTM stack behind an OpenTelemetry Collector, and both services'
  # Deployments have to become ready. The tests behind the functional tag
  # then run the shared cases against it, the failure injection cases
  # included, through kubectl port-forward, trusting the CA up.sh generated
  # and signing tokens with the key it made, and find an add's trace across
  # both services, its records, both services' metrics by pod, and the
  # Deployments' replicas and restarts in the LGTM stack. The ruleset doesn't
  # require this job, and Build doesn't wait on it; Vet the functional tests
  # vets them.
  shoppingcart-kind:
    name: Shoppingcart walkthrough (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: read
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
          with:
            go-version: '1.27.3'
            cache: false

        - id: go-cache
          uses: ./.github/actions/restore-go-cache
          with:
            name: shoppingcart-kind

        - name: Build the image
          run: docker build --file example/shoppingcart/Dockerfile --tag shoppingcart .

        - name: Render the kustomization
          run: kubectl kustomize example/shoppingcart/deploy/base

        - name: Bring the shoppingcart up on kind
          run: example/shoppingcart/deploy/kind/up.sh

        - name: Run the functional tests against kind
          run: go -C example/shoppingcart test -count=1 -race -tags functional ./functional/

        - name: Show the shoppingcart namespace
          if: ${{ failure() }}
          run: |
            kubectl --namespace shoppingcart get all
            kubectl --namespace shoppingcart describe pods
            kubectl --namespace shoppingcart logs deployment/postgres --tail 200 || true
            kubectl --namespace shoppingcart logs deployment/wiremock --tail 200 || true
            kubectl --namespace shoppingcart logs deployment/catalog --all-containers --tail 200 || true
            kubectl --namespace shoppingcart logs deployment/cart --all-containers --tail 200 || true
            kubectl --namespace shoppingcart logs deployment/otel-collector --tail 200 || true

        - if: ${{ !cancelled() && steps.go-cache.outputs.key != '' }}
          uses: ./.github/actions/save-go-cache
          with:
            key: ${{ steps.go-cache.outputs.key }}
            path: ${{ steps.go-cache.outputs.path }}

  # The billing walkthrough's tests behind the testcontainers build tag run
  # against PostgreSQL in a container. The ruleset doesn't require this job,
  # and Build doesn't wait on it; Vet the testcontainers tests vets them.
  billing-testcontainers:
    name: Billing walkthrough (testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
          with:
            go-version: '1.27.3'
            cache: false

        - id: go-cache
          uses: ./.github/actions/restore-go-cache
          with:
            name: billing-testcontainers

        - name: Test
          run: go -C example/billing test -count=1 -race -tags testcontainers ./...

        - if: ${{ !cancelled() && steps.go-cache.outputs.key != '' }}
          uses: ./.github/actions/save-go-cache
          with:
            key: ${{ steps.go-cache.outputs.key }}
            path: ${{ steps.go-cache.outputs.path }}

  # The billing walkthrough's image, built from its Dockerfile with the
  # repository as the context, since its module replaces humus with ../..,
  # and its kustomization, rendered. up.sh then creates a kind cluster,
  # loads the image and applies the kind overlay, with the LGTM stack the
  # job's telemetry goes to, and one Job made from the CronJob's template has
  # to complete. The tests behind the functional tag then run against it,
  # through kubectl port-forward and with the passwords from its Secrets: the
  # shared cases, each as Jobs made from the CronJob's template, the template
  # as it is, failing a bad setting by its pod failure policy, and a run whose
  # trace, records and metrics have to reach Tempo, Loki and Mimir. The
  # ruleset doesn't require this job, and Build doesn't wait on it; Vet the
  # functional tests vets them.
  billing-kind:
    name: Billing walkthrough (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: read
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
          with:
            go-version: '1.27.3'
            cache: false

        - id: go-cache
          uses: ./.github/actions/restore-go-cache
          with:
            name: billing-kind

        - name: Build the image
          run: docker build --file example/billing/Dockerfile --tag billing .

        - name: Render the kustomization
          run: kubectl kustomize example/billing/deploy

        - name: Bring the billing job up on kind
          run: example/billing/deploy/kind/up.sh

        - name: Run one Job from the CronJob's template
          run: |
            kubectl --namespace billing create job billing-kind --from=cronjob/billing
            kubectl --namespace billing wait --for=condition=Complete --timeout=5m job/billing-kind
            kubectl --namespace billing get pods --selector job-name=billing-kind \
              --output custom-columns=POD:.metadata.name,EXIT:.status.containerStatuses[0].state.terminated.exitCode
            failed=$(kubectl --namespace billing get job billing-kind --output jsonpath='{.status.failed}')
            if [ -n "$failed" ] && [ "$failed" != 0 ]; then
              echo "::error::billing exited non-zero in $failed pod(s) before a retry completed the Job"
              exit 1
            fi

        - name: Run the functional tests against kind
          run: go -C example/billing test -count=1 -race -tags functional ./functional/

        - name: Show the billing namespace
          if: ${{ failure() }}
          run: |
            kubectl --namespace billing get all
            kubectl --namespace billing describe pods
            kubectl --namespace billing logs job/billing-kind || true
            kubectl --namespace billing logs deployment/otel-collector || true

        - if: ${{ !cancelled() && steps.go-cache.outputs.key != '' }}
          uses: ./.github/actions/save-go-cache
          with:
            key: ${{ steps.go-cache.outputs.key }}
            path: ${{ steps.go-cache.outputs.path }}

  # The order status walkthrough's tests behind the testcontainers build tag
