            kubectl --namespace mailer describe pods
            kubectl --namespace mailer logs deployment/rabbitmq --tail 200 || true
            kubectl --namespace mailer logs deployment/mailer --all-containers --tail 200 || true
            kubectl --namespace mailer logs deployment/otel-collector --tail 200 || true

        - if: ${{ !cancelled() && steps.go-cache.outputs.key != '' }}
          uses: ./.github/actions/save-go-cache
          with:
