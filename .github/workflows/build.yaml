name: CI

on:
  push:
    branches:
      - "main"
    paths:
      - '**.go'
      - '**/go.mod'
      - '**/go.sum'
      - '.golangci.yaml'
      - '.github/scripts/**'
      - '.github/workflows/build.yaml'
  pull_request:
    branches:
      - "main"
  merge_group:

jobs:
  # The default branch's ruleset requires five checks: Build, Kafka
  # (testcontainers), RabbitMQ (testcontainers), Kubernetes (testcontainers)
  # and Shoppingcart (testcontainers). Build is the job at the end of this
  # file, which passes only when every job before it passed, so the jobs it
  # waits on can be added, split or renamed without changing the ruleset.
  #
  # `./...` does not descend into a nested module, so lint, compile and test
  # each run once per module that go-modules.sh lists, in a matrix, and every
  # module's run at the same time. A module added to the repository is in the
  # list, and so in every matrix, with no change here. No matrix fails fast,
  # so one run reports every failure.
  modules:
    name: Modules
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      modules: ${{ steps.list.outputs.modules }}
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
          with:
            go-version: '1.27.2'
            cache-dependency-path: '**/go.sum'

        - name: List modules
          id: list
          run: |
            modules=$(.github/scripts/go-modules.sh)
            test -n "$modules"
            echo "$modules"
            echo "modules=$(jq -cnR '[inputs]' <<<"$modules")" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint (${{ matrix.module }})
    needs: modules
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.modules.outputs.modules) }}
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
          with:
            go-version: '1.27.2'
            cache-dependency-path: '**/go.sum'

        - name: Install golangci-lint
          uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
          with:
            version: v2.15.0
            install-only: true

        - name: Lint
          working-directory: ${{ matrix.module }}
          run: golangci-lint run

  compile:
    name: Compile (${{ matrix.module }})
    needs: modules
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.modules.outputs.modules) }}
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
          with:
            go-version: '1.27.2'
            cache-dependency-path: '**/go.sum'

        - name: Build
          run: go -C "$MODULE" build ./...
          env:
            MODULE: ${{ matrix.module }}

  # A package's coverage comes only from its own module's tests, so each
  # module's job gates its own packages, and between them the gate still
  # covers every package outside example/.
  test:
    name: Test (${{ matrix.module }})
    needs: modules
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.modules.outputs.modules) }}
    env:
      MODULE: ${{ matrix.module }}
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
          with:
            go-version: '1.27.2'
            cache-dependency-path: '**/go.sum'

        - name: Test
          run: |
            go -C "$MODULE" test -race -cover \
              -coverprofile="$RUNNER_TEMP/coverage.out" ./...

        - name: List the packages the coverage gate covers
          if: ${{ !cancelled() }}
          run: |
            examples="$(go list -m)/example"
            go -C "$MODULE" list ./... > "$RUNNER_TEMP/module-packages.txt"
            awk -v examples="$examples" '$0 != examples && index($0, examples "/") != 1' \
              "$RUNNER_TEMP/module-packages.txt" > "$RUNNER_TEMP/packages.txt"

        - name: Require 80% statement coverage of every library package
          if: ${{ !cancelled() }}
          run: .github/scripts/coverage-gate.sh 80 "$RUNNER_TEMP/packages.txt" "$RUNNER_TEMP/coverage.out"

  # The tests behind the testcontainers tag run in the four testcontainers
  # jobs below, so here they are only compiled and vetted, without starting
  # a container, alongside the unit tests.
  vet-testcontainers:
    name: Vet the testcontainers tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
          with:
            go-version: '1.27.2'
            cache-dependency-path: '**/go.sum'

        - name: Vet
          run: |
            failed=0
            go -C queue/kafka vet -tags testcontainers ./... || failed=1
            go -C queue/rabbitmq vet -tags testcontainers ./... || failed=1
            go -C kube vet -tags testcontainers ./... || failed=1
            go -C example vet -tags testcontainers ./... || failed=1
            exit "$failed"

  # The loopback half of humustest's conformance test opens real sockets on
  # 127.0.0.1 and 127.0.0.2, and telemetry's sets OTEL_* variables in the
  # real environment, so both are behind the conformance build tag and run
  # here rather than with the unit tests.
  conformance:
    name: Conformance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
          with:
            go-version: '1.27.2'
            cache-dependency-path: '**/go.sum'

        - name: Conformance
          run: go test -race -tags conformance -run '^TestConformance_' ./humustest/ ./telemetry/

  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        # The release script runs go mod edit.
        - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
          with:
            go-version: '1.27.2'
            cache-dependency-path: '**/go.sum'

        - name: Test the coverage gate
          run: .github/scripts/coverage-gate_test.sh

        - name: Test the release script
          if: ${{ !cancelled() }}
          run: .github/scripts/release-modules_test.sh

  # The check the ruleset requires. It runs whatever happened to the jobs it
  # needs, and passes only when every one of them succeeded: a job that
  # failed, was cancelled or was skipped fails it. A skipped required check
  # counts as passing, so this job never skips itself.
  build:
    name: Build
    needs:
      - modules
      - lint
      - compile
      - test
      - vet-testcontainers
      - conformance
      - scripts
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
        - name: Require every job to have passed
          env:
            NEEDS: ${{ toJSON(needs) }}
          run: |
            jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
            jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null

  # The tests behind the testcontainers build tag run Kafka in a container
  # and open real sockets, so they run here rather than in Test: they don't
  # slow the unit tests, they don't count toward the coverage gate, and this
  # job is a required check of its own.
  kafka-testcontainers:
    name: Kafka (testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
          with:
            go-version: '1.27.2'
            cache-dependency-path: '**/go.sum'

        - name: Test
          run: go -C queue/kafka test -race -tags testcontainers ./...

  # The tests behind the testcontainers build tag run RabbitMQ in a container
  # and open real sockets, so they run here rather than in Test: they don't
  # slow the unit tests, they don't count toward the coverage gate, and this
  # job is a required check of its own. humus keeps no fake broker, so these
  # are the only tests of queue/rabbitmq that reach one.
  rabbitmq-testcontainers:
    name: RabbitMQ (testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
          with:
            go-version: '1.27.2'
            cache-dependency-path: '**/go.sum'

        - name: Test
          run: go -C queue/rabbitmq test -race -tags testcontainers ./...

  # The tests behind the testcontainers build tag run k3s's Kubernetes API
  # server in a container and open real sockets, so they run here rather than
  # in Test: they don't slow the unit tests, they don't count toward the
  # coverage gate, and this job is a required check of its own. humus keeps
  # no fake API server, so these are the only tests of kube that reach one.
  kube-testcontainers:
    name: Kubernetes (testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
          with:
            go-version: '1.27.2'
            cache-dependency-path: '**/go.sum'

        - name: Test
          run: go -C kube test -race -tags testcontainers ./...

  # The tests behind the testcontainers build tag run the shoppingcart's
  # Store, and the whole service on humus.OSHost(), against Postgres in a
  # container, so they run here rather than in Test: they don't slow the
  # unit tests, example/ is outside the coverage gate anyway, and this job is
  # a required check of its own.
  shoppingcart-testcontainers:
    name: Shoppingcart (testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
          with:
            go-version: '1.27.2'
            cache-dependency-path: '**/go.sum'

        - name: Test
          run: go -C example test -race -tags testcontainers ./...
