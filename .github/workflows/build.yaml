name: CI

on:
  push:
    branches:
      - "main"
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    branches:
      - "main"
  merge_group:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
          with:
            go-version: '1.26.5'

        - name: Lint Go Code
          uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9
          with:
            version: latest
            skip-cache: false

        - name: Build
          run: go build ./...

        - name: Test
          run: go test -race -cover -tags testcontainers ./...