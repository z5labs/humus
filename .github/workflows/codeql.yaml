name: "CodeQL"

on:
  push:
    branches:
      - "main"
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      # A push that changes how the job's Go cache is filled saves it again.
      - '.github/workflows/codeql.yaml'
      - '.github/actions/**'

  pull_request:
    branches:
      - "main"


  schedule:
    - cron: '34 11 * * 3'

jobs:
  analyze:
    name: Analyze
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    timeout-minutes: ${{ (matrix.language == 'swift' && 120) || 360 }}
    # actions: write lets save-go-cache delete the job's older caches.
    permissions:
      actions: write
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'go' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    # Custom Go version because of: https://github.com/github/codeql/issues/13992#issuecomment-1711721716
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version: '1.27.4'
        cache: false

    # The Go cache is CI's, restored from the one this job last saved on
    # main, rather than setup-go's, which a pull request that changes go.sum
    # saves under its own ref. See save-go-cache.
    - id: go-cache
      uses: ./.github/actions/restore-go-cache
      with:
        name: codeql

    - name: Initialize CodeQL
      uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
      with:
        languages: ${{ matrix.language }}

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
      with:
        category: "/language:${{matrix.language}}"

    - if: ${{ !cancelled() && steps.go-cache.outputs.key != '' }}
      uses: ./.github/actions/save-go-cache
      with:
        key: ${{ steps.go-cache.outputs.key }}
        path: ${{ steps.go-cache.outputs.path }}
