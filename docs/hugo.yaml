title: Humus
languageCode: en-us

module:
  imports:
    - path: github.com/google/docsy
      disable: false
      # Docsy's own mounts, less its favicons: the site's favicon is the humus
      # mark, from static/favicons/ and layouts/_partials/favicons.html, and
      # none of Docsy's icons is served beside it. Naming an import's mounts
      # replaces the ones its hugo.yaml declares, so the rest are repeated as
      # Docsy declares them for a Go module installation.
      mounts:
        - source: assets
          target: assets
        - source: i18n
          target: i18n
        - source: layouts
          target: layouts
        - source: static
          target: static
          excludeFiles: favicons/**
        - source: assets/_vendor/bootstrap/scss
          target: assets/vendor/bootstrap/scss/vendor
    - path: github.com/google/docsy/dependencies
      disable: false

# Output formats. Besides its HTML, every page has a Markdown copy at its URL
# followed by index.html.md, and the home page builds /llms.txt, which lists
# them, as https://llmstxt.org/ proposes. Both are built from the pages
# themselves, so a new page appears in them without editing a template.
outputFormats:
  llms:
    mediaType: text/plain
    baseName: llms
    isPlainText: true
    notAlternative: true
  markdown:
    mediaType: text/markdown
    baseName: index.html
    isPlainText: true
    notAlternative: true

outputs:
  home: [html, rss, llms, markdown]
  section: [html, rss, markdown]
  page: [html, markdown]

# Image processing configuration
imaging:
  resampleFilter: CatmullRom
  quality: 75
  anchor: smart

# Markup settings
markup:
  goldmark:
    renderer:
      unsafe: true
  # Chroma emits CSS classes rather than inline styles, so the theme's
  # stylesheet colours code blocks and they follow the light / dark toggle.
  # assets/scss/_styles_project.scss imports the dark palette.
  highlight:
    noClasses: false

# Site params
params:
  copyright: Z5Labs
  privacy_policy: ""

  # Repository
  github_repo: https://github.com/z5labs/humus
  github_project_repo: https://github.com/z5labs/humus

  # Enable Lunr.js offline search
  offlineSearch: true

  # UI
  ui:
    sidebar_menu_compact: true
    breadcrumb_disable: false
    sidebar_search_disable: false
    navbar_logo: true
    # Light / dark / auto toggle in the navbar. Auto follows the OS setting,
    # and the reader's choice is kept in localStorage across page loads.
    showLightDarkModeMenu: true

  # Links
  links:
    user:
      - name: GitHub Discussions
        url: https://github.com/z5labs/humus/discussions
        icon: fab fa-github
        desc: Discussion and help from the community
    developer:
      - name: GitHub
        url: https://github.com/z5labs/humus
        icon: fab fa-github
        desc: Development takes place here!
